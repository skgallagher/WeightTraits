[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weighttraits"
version = "0.1.0"
description = "Research toolkit for reconstructing and auditing fine-tuning lineages in language-model families."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Shannon K. Gallagher"}
]
keywords = ["language-models", "phylogenetics", "fine-tuning", "provenance", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
analysis = [
  "biopython>=1.83",
  "dendropy>=5.0",
  "matplotlib>=3.8",
  "networkx>=3.0",
  "pandas>=2.0",
  "safetensors>=0.4",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "seaborn>=0.13"
]
training = [
  "accelerate>=0.29",
  "datasets>=2.19",
  "evaluate>=0.4",
  "peft>=0.10",
  "transformers>=4.40",
  "wandb>=0.17"
]
blackbox = [
  "anthropic>=0.25",
  "google-genai>=1.0",
  "openai>=1.30",
  "python-dotenv>=1.0",
  "sentence-transformers>=2.7",
  "tqdm>=4.66"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
wt = "weighttraits.cli:main"

[project.urls]
Homepage = "https://github.com/skgallagher/WeightTraits"
Repository = "https://github.com/skgallagher/WeightTraits"
Issues = "https://github.com/skgallagher/WeightTraits/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
