result_sets:
  - id: tiny_mid_branching_contrast_whitebox_smoke
    title: Tiny mid-branching contrast whitebox smoke
    status: smoke_verified
    environment: wright
    truth_manifest: examples/training/tiny_mid_branching_contrast_manifest.jsonl
    notes: >
      Eleven trained nodes and seven terminal leaves with four informative truth splits.
      Summaries are generated by wt analyze-training-ledger and recorded in docs/HANDOFF.md.
    summaries:
      - id: full_model_steps2
        artifact: model
        training_config: examples/training/tiny_full_mid_branching_contrast_smoke.yaml
        summary: outputs/tiny_full_mid_branching_contrast_smoke/model_leaf_analysis/summary.json
      - id: lora_merged_steps2
        artifact: merged
        training_config: examples/training/tiny_lora_mid_branching_contrast_smoke.yaml
        summary: outputs/tiny_lora_mid_branching_contrast_smoke/merged_leaf_analysis/summary.json
      - id: lora_cumulative_steps2
        artifact: adapter_chain
        training_config: examples/training/tiny_lora_mid_branching_contrast_smoke.yaml
        summary: outputs/tiny_lora_mid_branching_contrast_smoke/cumulative_leaf_analysis/summary.json
      - id: full_model_steps8
        artifact: model
        training_config: examples/training/tiny_full_mid_branching_contrast_steps8_smoke.yaml
        summary: outputs/tiny_full_mid_branching_contrast_steps8_smoke/model_leaf_analysis/summary.json
      - id: lora_merged_steps8
        artifact: merged
        training_config: examples/training/tiny_lora_mid_branching_contrast_steps8_smoke.yaml
        summary: outputs/tiny_lora_mid_branching_contrast_steps8_smoke/merged_leaf_analysis/summary.json
      - id: lora_cumulative_steps8
        artifact: adapter_chain
        training_config: examples/training/tiny_lora_mid_branching_contrast_steps8_smoke.yaml
        summary: outputs/tiny_lora_mid_branching_contrast_steps8_smoke/cumulative_leaf_analysis/summary.json
