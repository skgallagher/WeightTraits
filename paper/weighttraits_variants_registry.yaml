version: 1
id: weighttraits_variants_rebuild
title: WeightTraits rebuild of the shared-tree Flan-T5 and Llama-3.2-1B tab:variants rows
description: >
  Maps the versioned confirm-paper direct-analysis rollups into the active
  paper's variants-table schema. Available LoRA rows use sequentially merged
  full model weights; the all-projections Flan row remains the separately labeled
  cumulative-update analysis because its historical adapters are unavailable.
  Full-FT rows use full model weights. The Llama rows use the same 50 truth manifests
  and task/data assignments as the Flan rows. Rerun the lightweight rollups with the current
  WeightTraits code before building this table so ordering fields are present.
metric: cosine

variants:
  - id: flan_lora_k_only
    section: "Encoder--decoder: Flan-T5-base"
    model: Flan-T5-base
    label: "LoRA: key only"
    recovery_group: weighttraits_lora_k_only
    summary: outputs/analysis_flan_merged_weights_20260804/aggregate/lora_k_only_rollup.json
    artifact: merged
    representation: full_weight

  - id: flan_lora_qkv
    section: "Encoder--decoder: Flan-T5-base"
    model: Flan-T5-base
    label: "LoRA: q/k/v"
    recovery_group: weighttraits_lora_qkv
    summary: outputs/analysis_flan_merged_weights_20260804/aggregate/lora_qkv_rollup.json
    artifact: merged
    representation: full_weight

  - id: flan_lora_full_attn
    section: "Encoder--decoder: Flan-T5-base"
    model: Flan-T5-base
    label: "LoRA: q/k/v/o (all attention)"
    recovery_group: weighttraits_lora_full_attn
    summary: outputs/analysis_flan_merged_weights_20260804/aggregate/lora_full_attn_rollup.json
