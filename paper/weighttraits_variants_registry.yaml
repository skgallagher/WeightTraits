  - id: flan_lora_all_projections
    section: "Encoder--decoder: Flan-T5-base"
    model: Flan-T5-base
    label: "LoRA: q/k/v/o + FFN projections"
    recovery_group: weighttraits_lora_all_projections_corrected
    summary: outputs/analysis_v20260713/lora_all_projections_corrected_summary.json
    artifact: adapter_chain
    representation: lora_cumulative_delta

  - id: flan_full_finetune
    section: "Encoder--decoder: Flan-T5-base"
    model: Flan-T5-base
    label: "Full fine-tuning"
    recovery_group: weighttraits_full_finetune
