training:
  model_family: llama32_1b_full_finetune
  base_model: meta-llama/Llama-3.2-1B
  base_model_revision: 4e20de362430cd3b72f300e6b0f18e50e7166e08
  method: full
  output_root: outputs/confirm_paper_numbers/llama32_1b_full_finetune
  trainer:
    model_task: causal_lm
    causal_loss_scope: completion
    seed: 20260713
    max_steps: 2000
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 32
    learning_rate: 0.00002
    warmup_steps: 200
    weight_decay: 0.01
    eval_steps: 250
    save_steps: 1000
    save_total_limit: 1
    cleanup_checkpoints_on_success: true
    bf16: true
    target_field: target
    max_seq_length: 640
    report_to: []
  prompt:
    default_template: "{input}"
    task_templates:
      summarization: "Summarize the following document.\n\n{document}\n\nSummary:"
      classification: "Classify the following text.\n\n{text}\n\nLabel:"
      qa: "Question: {question}\nContext: {context}\nAnswer:"
      translation: "Translate this English text.\n\n{source_text}\n\nTranslation:"
    dataset_templates:
      mnli: "Premise: {premise}\nHypothesis: {hypothesis}\nLabel:"
      rte: "Sentence 1: {sentence1}\nSentence 2: {sentence2}\nLabel:"
      qnli: "Question: {question}\nSentence: {sentence}\nLabel:"
      trivia_qa: "Question: {question}\nAnswer:"
      arc_easy: "Question: {question}\nChoices: {choices}\nAnswer:"
      arc_challenge: "Question: {question}\nChoices: {choices}\nAnswer:"
  stopping:
    metric: eval_loss
    early_stopping: {patience: 4, min_delta: 0.0}
    plateau: {window: 5, min_delta: 0.0002}
    warnings: {loss_increase_relative: 0.05, loss_increase_patience: 2}
