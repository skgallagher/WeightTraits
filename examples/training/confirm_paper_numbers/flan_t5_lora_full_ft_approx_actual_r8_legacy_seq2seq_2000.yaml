extends: flan_t5_legacy_seq2seq_2000_base.yaml

# Reproduces the modules that PEFT actually matched in the legacy
# full_ft_approx run. The historical declaration also named `wi`, which never
# matched Flan-T5's gated `wi_0`/`wi_1` modules and is intentionally omitted.
training:
  protocol_id: legacy_seq2seq_flan_t5_lora_full_ft_approx_actual_r8_2000_seed42_v1
  model_family: flan_t5_lora_full_ft_approx_actual_r8_legacy_seq2seq_2000
  method: lora
  output_root: outputs/confirm_paper_numbers/flan_t5_lora_full_ft_approx_actual_r8_legacy_seq2seq_2000
  trainer:
    gradient_checkpointing: false
  lora:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    target_modules: [q, k, v, o, wo]
    merge_after_train: true
