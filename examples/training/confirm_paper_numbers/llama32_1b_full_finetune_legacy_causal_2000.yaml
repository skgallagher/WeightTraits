# Corrected paper rebuild protocol for the fresh 50-tree WeightTraits design.
# Dataset rendering, sampling, and optimization intentionally match the legacy
# ELLMTrees Llama causal-LM pipeline; topology and assignments remain the fresh
# WeightTraits confirmation cohort.
training:
  protocol_id: legacy_causal_llama32_1b_full_ft_2000_seed42_v1
  model_family: llama32_1b_full_finetune_legacy_causal_2000
  base_model: meta-llama/Llama-3.2-1B
  base_model_revision: 4e20de362430cd3b72f300e6b0f18e50e7166e08
  method: full
  output_root: outputs/confirm_paper_numbers/llama32_1b_full_finetune_legacy_causal_2000
  trainer:
    model_task: causal_lm
    model_dtype: bfloat16
    # The legacy custom collator appended padding on the right, regardless of
    # the tokenizer object's nominal padding_side setting.
    padding_side: right
    pad_to_multiple_of: 8
    causal_loss_scope: completion
    min_prompt_tokens: 8
    require_max_steps: true
    seed: 42
    max_steps: 2000
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 0.00002
    warmup_steps: 200
    weight_decay: 0.01
    max_grad_norm: 1.0
    eval_steps: 250
    logging_steps: 10
    save_strategy: "no"
    gradient_checkpointing: false
    ddp_find_unused_parameters: false
    bf16: true
    target_field: target
    # Total prompt-plus-completion window for every task family, not a
    # completion-length target. The observed completion is tokenized first.
    max_seq_length: 1024
    report_to: []
  prompt:
    default_template: "{input}"
    task_templates:
      summarization: "Summarize the following document.\n\nDocument:\n{document}\n\nSummary:"
      qa: "Answer the following question.\n\n{qa_input}\n\nAnswer:"
    dataset_templates:
      sst2: "Classify the following text into one of: negative, positive.\n\nText: {text}\n\nLabel:"
      ag_news: "Classify the following text into one of: world, sports, business, sci/tech.\n\nText: {text}\n\nLabel:"
      mnli: "Classify the following text pair into one of: entailment, neutral, contradiction.\n\nText: {text}\nHypothesis: {hypothesis}\n\nLabel:"
      imdb: "Classify the following text into one of: negative, positive.\n\nText: {text}\n\nLabel:"
      rte: "Classify the following text pair into one of: entailment, not_entailment.\n\nText: {text}\nHypothesis: {hypothesis}\n\nLabel:"
      cola: "Classify the following text into one of: unacceptable, acceptable.\n\nText: {text}\n\nLabel:"
      qnli: "Classify the following text pair into one of: entailment, not_entailment.\n\nText: {text}\nHypothesis: {hypothesis}\n\nLabel:"
      yelp_polarity: "Classify the following text into one of: negative, positive.\n\nText: {text}\n\nLabel:"
      dbpedia_14: "Classify the following text into one of: company, educational_institution, artist, athlete, office_holder, transportation, building, natural_place, village, animal, plant, album, film, written_work.\n\nText: {text}\n\nLabel:"
      trec: "Classify the following text into one of: a group or organization of persons, abbreviation, an individual, animals, cities, colors, countries, currency names, dates, definition of something, description of a person, description of something, diseases and medicine, elements and substances, equivalent terms, events, expression abbreviated, food, fractions, inventions, books and other creative pieces, languages, letters like a-z, linear measures, manner of an action, mountains, musical instrument, number of something, organs of body, other entities, other locations, other numbers, plants, postcodes or other codes, prices, products, ranks, reasons, religions, size, area and volume, speed, sports, states, symbols and signs, techniques and methods, temperature, the lasting time of something, title of a person, vehicles, weight, words with a special property.\n\nText: {text}\n\nLabel:"
      wmt14_en_fr: "Translate the following English text to French.\n\nText:\n{source_text}\n\nTranslation:"
      wmt14_en_de: "Translate the following English text to German.\n\nText:\n{source_text}\n\nTranslation:"
      opus_en_de: "Translate the following English text to German.\n\nText:\n{source_text}\n\nTranslation:"
      opus_en_fr: "Translate the following English text to French.\n\nText:\n{source_text}\n\nTranslation:"
      opus_en_es: "Translate the following English text to Spanish.\n\nText:\n{source_text}\n\nTranslation:"
      opus_en_it: "Translate the following English text to Italian.\n\nText:\n{source_text}\n\nTranslation:"
      opus_en_ru: "Translate the following English text to Russian.\n\nText:\n{source_text}\n\nTranslation:"
      opus_en_zh: "Translate the following English text to Chinese.\n\nText:\n{source_text}\n\nTranslation:"
      opus_en_ja: "Translate the following English text to Japanese.\n\nText:\n{source_text}\n\nTranslation:"
  stopping:
    enabled: false
