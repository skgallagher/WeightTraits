version: 1
task_families:
  summarization:
    datasets:
      - id: cnn_dailymail
        hf_args: [abisee/cnn_dailymail, "3.0.0"]
        train_split: train
        eval_split: validation
      - id: xsum
        hf_args: [EdinburghNLP/xsum]
        train_split: train
        eval_split: validation
      - id: samsum
        hf_args: [knkarthick/samsum]
        train_split: train
        eval_split: validation
      - id: billsum
        hf_args: [FiscalNote/billsum]
        train_split: train
        eval_split: test
      - id: pubmed
        hf_args: [ccdv/pubmed-summarization]
        train_split: train
        eval_split: validation
      - id: govreport
        hf_args: [ccdv/govreport-summarization]
        train_split: train
        eval_split: validation
      - id: arxiv_summ
        hf_args: [ccdv/arxiv-summarization]
        train_split: train
        eval_split: validation
      - id: bigpatent
        hf_args: [NortheasternUniversity/big_patent, all]
        train_split: train
        eval_split: validation
      - id: dialogsum
        hf_args: [knkarthick/dialogsum]
        train_split: train
        eval_split: validation
