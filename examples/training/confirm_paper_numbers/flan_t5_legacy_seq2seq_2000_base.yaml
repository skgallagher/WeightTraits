# Shared numerical and rendering contract for the fresh Flan-T5 paper rebuild.
# Cohort overlays must supply protocol_id, model_family, method, output_root,
# gradient_checkpointing, and (for LoRA) the exact adapter scope.
training:
  base_model: google/flan-t5-base
  base_model_revision: 7bcac572ce56db69c1ea7c8af255c5d7c9672fc2
  trainer:
    model_task: seq2seq
    expected_runtime:
      python: 3.11.15
      torch: 2.5.1+cu121
      transformers: 5.8.0
      datasets: 4.8.5
      accelerate: 1.13.0
      tokenizers: 0.22.2
      peft: 0.19.1
    expected_source_code:
      algorithm: sha256-relative-path-and-content-v1
      file_count: 60
      sha256: 1445e45de825615dba929a63f8812d66e6105170002ff8c1ed35ee4a338e796b
    expected_cache_source_receipt:
      path: examples/training/confirm_paper_numbers/legacy_causal_seed42_cache_source_receipt.json
      sha256: f3f185801afd6c7f01fb015d69544574d3d6ef48da375e1eadcd0eff32d00818
    padding_side: right
    # Matches the legacy ELLMTrees DataCollatorForSeq2Seq contract.
    pad_to_multiple_of: 8
    require_max_steps: true
    seed: 42
    max_steps: 2000
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 0.0003
    warmup_steps: 200
    weight_decay: 0.01
    max_grad_norm: 1.0
    eval_steps: 250
    logging_steps: 10
    save_strategy: "no"
    bf16: true
    target_field: target
    max_source_length: 512
    max_target_length: 128
    predict_with_generate: true
    generation_max_length: 128
    report_to: []
  prompt:
    default_template: "{input}"
    task_templates:
      classification: "classify: {text}"
      summarization: "summarize: {document}"
      qa: "{qa_input}"
    dataset_templates:
      mnli: "classify: {text} hypothesis: {hypothesis}"
      rte: "classify: {text} hypothesis: {hypothesis}"
      qnli: "classify: {text} hypothesis: {hypothesis}"
      wmt14_en_fr: "translate English to French: {source_text}"
      wmt14_en_de: "translate English to German: {source_text}"
      opus_en_de: "translate English to German: {source_text}"
      opus_en_fr: "translate English to French: {source_text}"
      opus_en_es: "translate English to Spanish: {source_text}"
      opus_en_it: "translate English to Italian: {source_text}"
      opus_en_ru: "translate English to Russian: {source_text}"
      opus_en_zh: "translate English to Chinese: {source_text}"
      opus_en_ja: "translate English to Japanese: {source_text}"
  stopping:
    enabled: false
