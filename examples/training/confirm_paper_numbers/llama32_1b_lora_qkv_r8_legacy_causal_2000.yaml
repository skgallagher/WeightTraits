# Exact legacy Llama causal-LM contract with the historical QKV LoRA rank-8
# adapter scope. Everything not listed here is inherited from the audited
# full-fine-tuning protocol, including rendering, sampling, batching, and the
# combined 1024-token prompt-plus-completion window.
extends: llama32_1b_full_finetune_legacy_causal_2000.yaml

training:
  protocol_id: legacy_causal_llama32_1b_lora_qkv_r8_2000_seed42_v1
  model_family: llama32_1b_lora_qkv_r8_legacy_causal_2000
  method: lora
  output_root: outputs/confirm_paper_numbers/llama32_1b_lora_qkv_r8_legacy_causal_2000
  trainer:
    learning_rate: 0.0003
    gradient_checkpointing: false
  lora:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj]
    merge_after_train: true
