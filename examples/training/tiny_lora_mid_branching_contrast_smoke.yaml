training:
  model_family: tiny_t5_lora_mid_branching_contrast
  base_model: hf-internal-testing/tiny-random-t5
  method: lora
  output_root: outputs/tiny_lora_mid_branching_contrast_smoke
  trainer:
    model_task: seq2seq
    max_steps: 2
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 1
    learning_rate: 0.001
    logging_steps: 1
    eval_steps: 1
    save_steps: 1
    save_total_limit: 1
    target_field: answer
    max_source_length: 112
    max_target_length: 16
    report_to: []
  lora:
    r: 2
    lora_alpha: 4
    lora_dropout: 0.0
    target_modules:
      - q
      - v
    merge_after_train: true
  prompt:
    default_template: "Question: {question}\nContext: {context}\nReply with the code:"
  stopping:
    metric: eval_loss
    early_stopping:
      patience: 4
      min_delta: 0.0
    plateau:
      window: 3
      min_delta: 0.000001
    warnings:
      loss_increase_relative: 0.1
      loss_increase_patience: 1
